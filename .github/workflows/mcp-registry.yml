name: MCP Registry

# Lists the NanoFlags MCP server (packages/mcp/server.json) in the official MCP Registry
# (https://registry.modelcontextprotocol.io) once auto-release.yml has put that version of @nanoflags/mcp on npm.
#
# Authentication is GitHub OIDC (`mcp-publisher login github-oidc`): the registry grants the namespace
# io.github.<repository owner>/* to this workflow, so no DNS record and no secret is needed. The registry checks that
# the npm package's `mcpName` equals the server.json `name`.
#
# Idempotent: a server.json version that is already in the registry is skipped, so re-runs (and every auto-release
# run that releases something else) are harmless. Releasing a new version = bump packages/mcp/package.json and
# server.json (`version` and `packages[0].version`) together; auto-release.yml publishes npm, then this lists it.

on:
  workflow_run:
    workflows: ["Auto release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC login to the MCP Registry

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      # sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.16_checksums.txt of that release.
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
      REGISTRY: https://registry.modelcontextprotocol.io
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          name=$(jq -r .name server.json); version=$(jq -r .version server.json)
          pkg=$(jq -r '.packages[0].identifier' server.json); pkg_version=$(jq -r '.packages[0].version' server.json)
          [ "$pkg" = "$(jq -r .name package.json)" ] || { echo "::error::server.json package $pkg is not package.json $(jq -r .name package.json)"; exit 1; }
          [ "$pkg_version" = "$version" ] && [ "$version" = "$(jq -r .version package.json)" ] || { echo "::error::server.json version/package version and package.json version differ"; exit 1; }
          [ "$name" = "$(jq -r .mcpName package.json)" ] || { echo "::error::server.json name $name is not package.json mcpName"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"

          enc_name=$(jq -rn --arg v "$name" '$v|@uri'); enc_version=$(jq -rn --arg v "$version" '$v|@uri')
          code=$(curl -s -o /dev/null -w '%{http_code}' "$REGISTRY/v0.1/servers/$enc_name/versions/$enc_version")
          if [ "$code" = 200 ]; then
            echo "::notice title=MCP Registry: already listed::$name $version is already in the MCP Registry."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          elif [ "$code" != 404 ]; then echo "::error::MCP Registry answered $code for $name $version"; exit 1; fi

          # The npm package must be published (and carry the mcpName) before the registry accepts the server.
          for i in $(seq 1 20); do
            npm_code=$(curl -s -o "$RUNNER_TEMP/npm.json" -w '%{http_code}' "https://registry.npmjs.org/$pkg/$pkg_version")
            [ "$npm_code" = 200 ] && break
            echo "npm $pkg@$pkg_version: $npm_code (attempt $i)"; sleep 15
          done
          if [ "$npm_code" != 200 ]; then
            echo "::notice title=MCP Registry: npm package missing::$pkg@$pkg_version is not on npm; nothing listed."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm_mcp_name=$(jq -r '.mcpName // empty' "$RUNNER_TEMP/npm.json")
          [ "$npm_mcp_name" = "$name" ] || { echo "::error::$pkg@$pkg_version on npm has mcpName '$npm_mcp_name', expected $name"; exit 1; }
          echo "$name $version: to publish"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.plan.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.plan.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --retry 3 --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum -c -
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          mkdir -p bin && tar -xzf "$archive" -C bin mcp-publisher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in (GitHub OIDC)
        if: steps.plan.outputs.publish == 'true'
        run: mcp-publisher login github-oidc

      - name: Publish
        if: steps.plan.outputs.publish == 'true'
        env:
          NAME: ${{ steps.plan.outputs.name }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mcp-publisher publish
          echo "::notice title=MCP Registry: published::$NAME $VERSION — $REGISTRY/v0.1/servers/$(jq -rn --arg v "$NAME" '$v|@uri')/versions/$VERSION"
