# PHP SDK CI: tests only, nothing is published (php/nanoflags -> nanoflags/nanoflags, php/openfeature-provider ->
# nanoflags/openfeature-provider; see php/nanoflags/README.md). No secrets: the optional live check uses the PUBLIC demo
# browser key (client view of the public demo environment, read-only).
name: PHP SDK

on:
  push:
    branches: [main]
    paths: ["php/**", "packages/engine/fixtures/**", "go/internal/testdata/**", ".github/workflows/php.yml"]
  pull_request:
    branches: [main]
    paths: ["php/**", "packages/engine/fixtures/**", "go/internal/testdata/**", ".github/workflows/php.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: nanoflags/nanoflags · PHP ${{ matrix.php }}${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        extensions: ["sodium, curl, intl, apcu"]
        label: [""]
        include:
          # Hosts without intl or curl: the Unicode normalisation polyfill and the stream transport.
          - php: "8.1"
            extensions: "sodium, :curl, :intl"
            label: " (no curl, no intl)"
    defaults:
      run:
        working-directory: php/nanoflags
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: apc.enable_cli=1
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: |
          find src tests bin -type f \( -name '*.php' -o -name 'nanoflags-sync' \) -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Test (unit, engine parity incl. extra.json, local HTTP)
        run: vendor/bin/phpunit
      - name: Sync daemon starts
        run: bin/nanoflags-sync --help

  openfeature:
    name: nanoflags/openfeature-provider · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.4"]
    defaults:
      run:
        working-directory: php/openfeature-provider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install (nanoflags/nanoflags from this repository)
        run: |
          composer config repositories.nanoflags '{"type": "path", "url": "../nanoflags", "options": {"symlink": false, "versions": {"nanoflags/nanoflags": "'"$(sed -n "s/.*SDK_VERSION = '\\(.*\\)';/\\1/p" ../nanoflags/src/Client.php)"'"}}}'
          composer install --no-interaction --no-progress --prefer-dist
      - name: Test
        run: vendor/bin/phpunit

  live:
    name: hosted edge (read-only, public demo key)
    if: github.event_name != 'pull_request'
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: php/nanoflags
    env:
      NANOFLAGS_LIVE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: sodium, curl, intl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verified bundle from https://edge.nanoflags.io
        run: vendor/bin/phpunit --group live
