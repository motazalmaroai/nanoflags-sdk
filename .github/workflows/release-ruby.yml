name: Release Ruby gems

# Tags ruby-nanoflags-v<version> (gem nanoflags, ruby/nanoflags) and ruby-nanoflags-openfeature-v<version> (gem
# nanoflags-openfeature, ruby/nanoflags-openfeature), pushed by auto-release.yml when a version.rb carries a version
# that is not on rubygems.org yet (nanoflags first). Publishes with RubyGems Trusted Publishing (OIDC, no stored API
# key): the trusted publisher of each gem on rubygems.org names this workflow file and the environment `rubygems`
# (required reviewer: the founder). See ruby/PUBLISHING.md.

on:
  push:
    tags: ["ruby-nanoflags-v*", "ruby-nanoflags-openfeature-v*"]

permissions:
  contents: read

concurrency:
  # One release at a time, in the order the tags were pushed (the SDK before the provider that depends on it).
  group: release-ruby
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rubygems
    permissions:
      contents: read
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify the release commit is on main
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main; releases are built from commits on main only."
            exit 1
          fi
      - name: Check the tag matches version.rb and is not published yet
        id: gem
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            ruby-nanoflags-openfeature-v*) gem=nanoflags-openfeature; dir=ruby/nanoflags-openfeature; file=lib/nanoflags/openfeature/version.rb; tag_version="${tag#ruby-nanoflags-openfeature-v}";;
            ruby-nanoflags-v*) gem=nanoflags; dir=ruby/nanoflags; file=lib/nanoflags/version.rb; tag_version="${tag#ruby-nanoflags-v}";;
            *) echo "::error::unexpected tag $tag"; exit 1;;
          esac
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' "$dir/$file")
          if [ -z "$version" ]; then echo "::error::no VERSION in $dir/$file"; exit 1; fi
          if [ "$tag_version" != "$version" ]; then echo "::error::tag $tag does not match $gem $version ($dir/$file)"; exit 1; fi
          echo "gem=$gem" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o "$RUNNER_TEMP/versions.json" -w '%{http_code}' "https://rubygems.org/api/v1/versions/$gem.json")
          if [ "$code" = 200 ] && jq -e --arg v "$version" 'any(.[]; .number == $v)' "$RUNNER_TEMP/versions.json" > /dev/null; then
            echo "::notice title=Already published::$gem $version is already on rubygems.org; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 200 ] || [ "$code" = 404 ]; then
            echo "$gem $version: to release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::rubygems.org answered $code for $gem"; exit 1
          fi
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1
        if: steps.gem.outputs.skip == 'false'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ steps.gem.outputs.dir }}
      - name: Test
        if: steps.gem.outputs.skip == 'false'
        working-directory: ${{ steps.gem.outputs.dir }}
        run: bundle exec rake test
      - name: Build
        if: steps.gem.outputs.skip == 'false'
        working-directory: ${{ steps.gem.outputs.dir }}
        env:
          GEM: ${{ steps.gem.outputs.gem }}
          VERSION: ${{ steps.gem.outputs.version }}
        run: |
          gem build "$GEM.gemspec"
          test -f "$GEM-$VERSION.gem" || { echo "::error::expected $GEM-$VERSION.gem"; exit 1; }
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: steps.gem.outputs.skip == 'false'
      - name: Push to rubygems.org
        if: steps.gem.outputs.skip == 'false'
        working-directory: ${{ steps.gem.outputs.dir }}
        env:
          GEM: ${{ steps.gem.outputs.gem }}
          VERSION: ${{ steps.gem.outputs.version }}
        run: gem push "$GEM-$VERSION.gem"
