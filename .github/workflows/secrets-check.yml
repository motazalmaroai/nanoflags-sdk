name: Secrets check

# Manual only. For each protected environment it checks that the secrets the release workflows read are present there
# (length greater than zero) and prints "present" or "missing": never a value. Use it after moving or rotating a secret,
# before deleting the old repository-level copy. Environments with required reviewers wait for the approval, as in a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-central:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: maven-central
    env:
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
    steps:
      - name: Presence only
        run: |
          status=0
          for name in GPG_SIGNING_KEY GPG_SIGNING_PASSWORD CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD; do
            if [ -n "${!name}" ]; then echo "$name: present"; else echo "$name: missing"; status=1; fi
          done
          exit $status

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Presence only
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "NPM_TOKEN: present"; else echo "NPM_TOKEN: missing"; exit 1; fi

  release-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-tags
    env:
      RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
    steps:
      - name: Presence only
        run: |
          if [ -n "$RELEASE_TAG_TOKEN" ]; then echo "RELEASE_TAG_TOKEN: present"; else echo "RELEASE_TAG_TOKEN: missing"; exit 1; fi

  php-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: php-mirror
    env:
      PHP_MIRROR_TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }}
    steps:
      - name: Presence only
        run: |
          if [ -n "$PHP_MIRROR_TOKEN" ]; then echo "PHP_MIRROR_TOKEN: present"; else echo "PHP_MIRROR_TOKEN: missing"; exit 1; fi
