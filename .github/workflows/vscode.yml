name: VS Code extension

# Builds, tests and packages vscode/ (vscode-nanoflags) on pull requests and pushes; the .vsix is uploaded as an
# artifact. Publishing happens only on a tag vscode-v<version> matching vscode/package.json, to the Visual Studio
# Marketplace (secret VSCE_PAT) and Open VSX (secret OVSX_PAT), each skipped with a notice while its secret is missing.
# Secrets live in the environment `vscode-marketplace`. See vscode/PUBLISHING.md.

on:
  push:
    branches: [main]
    tags: ["vscode-v*"]
    paths: ["vscode/**", ".github/workflows/vscode.yml"]
  pull_request:
    paths: ["vscode/**", ".github/workflows/vscode.yml"]

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: vscode

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package
        # vscode:prepublish typechecks, tests and builds the minified bundle.
        run: npx vsce package --no-dependencies --out vscode-nanoflags.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-nanoflags-vsix
          path: vscode/vscode-nanoflags.vsix
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the release commit is on main
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main; releases are built from commits on main only."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vscode-nanoflags-vsix
          path: vscode
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice title=VSCE_PAT missing::Not published to the Visual Studio Marketplace (vscode/PUBLISHING.md)."; exit 0; fi
          npx vsce publish --packagePath vscode-nanoflags.vsix --skip-duplicate
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice title=OVSX_PAT missing::Not published to Open VSX (vscode/PUBLISHING.md)."; exit 0; fi
          # The namespace must exist before the first publish; creating one that already exists fails harmlessly.
          npx ovsx create-namespace nanoflags || echo "namespace nanoflags exists (or could not be created; publish will say)"
          npx ovsx publish vscode-nanoflags.vsix --skip-duplicate
