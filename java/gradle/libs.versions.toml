[versions]
junit = "5.11.4"
okhttp = "4.12.0"
bouncycastle = "1.82"
openfeature = "1.22.1"
spotbugs-annotations = "4.8.6"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
openfeature = { module = "dev.openfeature:sdk", version.ref = "openfeature" }
# Annotations the OpenFeature SDK classes carry (provided scope there); compile-time only, never shipped.
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
