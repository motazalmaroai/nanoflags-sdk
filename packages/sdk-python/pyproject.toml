[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nanoflags"
version = "0.1.0"
description = "NanoFlags server SDK for Python: local, deterministic feature-flag evaluation with signed live updates."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alibtekarat Althkiya Company for Trading & Marketing (Intinovate)", email = "support@nanoflags.io" }]
keywords = ["feature flags", "feature toggles", "nanoflags", "openfeature", "rollout"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=41",
  "websockets>=15.0",
]

[project.optional-dependencies]
openfeature = ["openfeature-sdk>=0.8.0"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://nanoflags.io"
Source = "https://github.com/motazalmaroai/nanoflags-sdk"
Issues = "https://github.com/motazalmaroai/nanoflags-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoflags"]

[tool.hatch.build.targets.sdist]
include = ["src/nanoflags", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["production: talks to the hosted edge (opt in with NANOFLAGS_PRODUCTION_TESTS=1)"]
